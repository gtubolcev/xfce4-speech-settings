name: arch packages
on:
  push:
  pull_request:
jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git sudo
      - uses: actions/checkout@v4
      - name: build with makepkg (not as root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          su builder -c 'git config --global --add safe.directory "*"; cd arch && makepkg --syncdeps --noconfirm --cleanbuild'
      - run: ls -l arch/*.pkg.tar.*
      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: arch/*.pkg.tar.*
